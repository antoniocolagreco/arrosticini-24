name: arrosticini

services:
  valkey:
    image: valkey/valkey:9.0-alpine
    ports:
      - "6379:6379"

  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000"]
      interval: 1s
      timeout: 2s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - s3-data:/data

  stripe:
    image: stripe/stripe-cli:v1.51.0
    profiles: ["stripe"]
    command:
      - listen
      - --events
      - checkout.session.completed,checkout.session.expired
      - --forward-to
      - host.docker.internal:${WEB_PORT:-3100}/webhooks/stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["full"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      S3_ENDPOINT: http://s3:9000
      MEDIA_BUCKET: ${MEDIA_BUCKET:-media}
      PRODUCTS_TABLE: ${PRODUCTS_TABLE:-products}
      USERS_TABLE: ${USERS_TABLE:-users}
      USER_EMAILS_TABLE: ${USER_EMAILS_TABLE:-user-emails}
      ORDERS_TABLE: ${ORDERS_TABLE:-orders}
      PAYMENTS_TABLE: ${PAYMENTS_TABLE:-payments}
      PAYMENT_CUSTOMERS_TABLE: ${PAYMENT_CUSTOMERS_TABLE:-payment-customers}
      STRIPE_EVENTS_TABLE: ${STRIPE_EVENTS_TABLE:-stripe-events}
      VALKEY_URL: redis://valkey:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      valkey:
        condition: service_started
      dynamodb:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["full"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_URL: http://api:4000
      VALKEY_URL: redis://valkey:6379
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3100}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:9100/media}
    ports:
      - "${WEB_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  s3-data:
  dynamodb-data:
