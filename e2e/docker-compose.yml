services:
  api:
    image: arrosticini-api
    environment:
      DYNAMODB_ENDPOINT: ${E2E_DYNAMODB_CONTAINER_ENDPOINT:-http://host.docker.internal:8000}
      S3_ENDPOINT: ${E2E_S3_CONTAINER_ENDPOINT:-http://host.docker.internal:9100}
      VALKEY_URL: ${E2E_VALKEY_CONTAINER_URL:-redis://host.docker.internal:6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    image: ${E2E_WEB_IMAGE:-arrosticini-web}
    environment:
      VALKEY_URL: ${E2E_VALKEY_CONTAINER_URL:-redis://host.docker.internal:6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
