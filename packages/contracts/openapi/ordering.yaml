                            properties:
                              slug:
                                type: string
                                maxLength: 64
                                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                              name:
                                type: object
                                properties:
                                  it:
                                    type: string
                                    minLength: 1
                                    maxLength: 120
                                  en:
                                    type: string
                                    minLength: 1
                                    maxLength: 120
                                required:
                                  - it
                                  - en
                              unitPriceCents:
                                type: integer
                                minimum: 0
                                maximum: 9007199254740991
                              quantity:
                                type: integer
                                minimum: 1
                                maximum: 9007199254740991
                            required:
                              - slug
                              - name
                              - unitPriceCents
                              - quantity
                        shippingAddress:
                          type: object
                          properties:
                            fullName:
                              type: string
                            line1:
                              type: string
                            line2:
                              type: string
                            city:
                              type: string
                            postalCode:
                              type: string
                            country:
                              type: string
                            phone:
                              type: string
                          required:
                            - fullName
                            - line1
                            - city
                            - postalCode
                            - country
                        totalCents:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                        currency:
                          const: EUR
                        status:
                          enum:
                            - PENDING_PAYMENT
                            - PAID
                            - CANCELLED
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        paidAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - userId
                        - lines
                        - shippingAddress
                        - totalCents
                        - currency
                        - status
                        - createdAt
                required:
                  - items
        "401":
          description: "401"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: UNAUTHORIZED
                      status:
                        const: 401
                      message:
                        type: string
                        default: Unauthorized
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: false
                      code:
                        type: string
                      status:
                        type: number
                      message:
                        type: string
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
