info:
  title: Arrosticini 24ore ordering API
  version: 1.0.0
openapi: 3.1.1
paths:
  /ordering/orders:
    post:
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cartId:
                  type: string
                  pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
                addressId:
                  type: string
                  pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
              required:
                - cartId
                - addressId
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
                      userId:
                        type: string
                        pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            slug:
                              type: string
                              maxLength: 64
                              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                            name:
                              type: object
                              properties:
                                it:
                                  type: string
                                  minLength: 1
                                  maxLength: 120
                                en:
                                  type: string
                                  minLength: 1
                                  maxLength: 120
                              required:
                                - it
                                - en
                            unitPriceCents:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            quantity:
                              type: integer
                              minimum: 1
                              maximum: 9007199254740991
                          required:
                            - slug
                            - name
                            - unitPriceCents
                            - quantity
                      shippingAddress:
                        type: object
                        properties:
                          fullName:
                            type: string
                          line1:
                            type: string
                          line2:
                            type: string
                          city:
                            type: string
                          postalCode:
                            type: string
                          country:
                            type: string
                          phone:
                            type: string
                        required:
                          - fullName
                          - line1
                          - city
                          - postalCode
                          - country
                      totalCents:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      currency:
                        const: EUR
                      status:
                        enum:
                          - PENDING_PAYMENT
                          - PAID
                          - CANCELLED
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      paidAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - userId
                      - lines
                      - shippingAddress
                      - totalCents
                      - currency
                      - status
                      - createdAt
                  paymentUrl:
                    type: string
                    format: uri
                required:
                  - order
        "401":
          description: "401"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: UNAUTHORIZED
                      status:
                        const: 401
                      message:
                        type: string
                        default: Unauthorized
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: false
                      code:
                        type: string
                      status:
                        type: number
                      message:
                        type: string
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
        "404":
          description: "404"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: CART_NOT_FOUND
                      status:
                        const: 404
                      message:
                        type: string
                        default: CART_NOT_FOUND
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: ADDRESS_NOT_FOUND
                      status:
                        const: 404
                      message:
                        type: string
                        default: ADDRESS_NOT_FOUND
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: false
                      code:
                        type: string
                      status:
                        type: number
                      message:
                        type: string
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
        "422":
          description: "422"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: CART_EMPTY
                      status:
                        const: 422
                      message:
                        type: string
                        default: CART_EMPTY
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: PRODUCT_UNAVAILABLE
                      status:
                        const: 422
                      message:
                        type: string
                        default: PRODUCT_UNAVAILABLE
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: false
                      code:
                        type: string
                      status:
                        type: number
                      message:
                        type: string
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
    get:
      operationId: listOrders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
