                      - admin
                    type: string
                  status:
                    enum:
                      - ACTIVE
                      - SUSPENDED
                    type: string
                  firstName:
                    type: string
                    minLength: 1
                    maxLength: 60
                  lastName:
                    type: string
                    minLength: 1
                    maxLength: 60
                  preferredLocale:
                    enum:
                      - it
                      - en
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - email
                  - role
                  - status
                  - firstName
                  - lastName
                  - preferredLocale
                  - createdAt
        "401":
          description: "401"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: INVALID_CREDENTIALS
                      status:
                        const: 401
                      message:
                        type: string
                        default: INVALID_CREDENTIALS
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: false
                      code:
                        type: string
                      status:
                        type: number
                      message:
                        type: string
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
        "403":
          description: "403"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: ACCOUNT_SUSPENDED
                      status:
                        const: 403
                      message:
                        type: string
                        default: ACCOUNT_SUSPENDED
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: false
                      code:
                        type: string
                      status:
                        type: number
                      message:
                        type: string
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
