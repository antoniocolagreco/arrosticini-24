info:
  title: Arrosticini 24ore identity API
  version: 1.0.0
openapi: 3.1.1
paths:
  /identity/users:
    post:
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 60
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 60
                preferredLocale:
                  enum:
                    - it
                    - en
                  type: string
              required:
                - email
                - password
                - firstName
                - lastName
                - preferredLocale
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
                  email:
                    type: string
                    format: email
                  role:
                    enum:
                      - customer
                      - admin
                    type: string
                  status:
                    enum:
                      - ACTIVE
                      - SUSPENDED
                    type: string
                  firstName:
                    type: string
                    minLength: 1
                    maxLength: 60
                  lastName:
                    type: string
                    minLength: 1
                    maxLength: 60
                  preferredLocale:
                    enum:
                      - it
                      - en
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - email
                  - role
                  - status
                  - firstName
                  - lastName
                  - preferredLocale
                  - createdAt
        "409":
          description: "409"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      defined:
                        const: true
                      code:
                        const: EMAIL_TAKEN
                      status:
                        const: 409
                      message:
                        type: string
                        default: EMAIL_TAKEN
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
                  - type: object
                    properties:
                      defined:
                        const: false
                      code:
                        type: string
                      status:
                        type: number
                      message:
                        type: string
                      data: {}
                    required:
                      - defined
                      - code
                      - status
                      - message
  /identity/credentials/verify:
    post:
      operationId: verifyCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - email
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
                  email:
                    type: string
                    format: email
                  role:
                    enum:
