<!-- @dsCard group="Forms" height=130 -->
<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>QuantityStepper</title></head>
<body>
<div class="a24-demo">
  <div class="a24-demo-row">
    <div class="a24-state"><small>At 1 · minus off</small><div class="a24-qty" role="group" aria-label="Quantità"><button type="button" aria-label="Diminuisci" disabled><i data-lucide="minus" aria-hidden="true"></i></button><output aria-live="polite">1</output><button type="button" aria-label="Aumenta"><i data-lucide="plus" aria-hidden="true"></i></button></div></div>
    <div class="a24-state"><small>Above 1</small><div class="a24-qty" role="group" aria-label="Quantità"><button type="button" aria-label="Diminuisci"><i data-lucide="minus" aria-hidden="true"></i></button><output aria-live="polite">3</output><button type="button" aria-label="Aumenta"><i data-lucide="plus" aria-hidden="true"></i></button></div></div>
    <div class="a24-state"><small>Hover on plus</small><div class="a24-qty" role="group" aria-label="Quantità"><button type="button" aria-label="Diminuisci"><i data-lucide="minus" aria-hidden="true"></i></button><output aria-live="polite">2</output><button type="button" aria-label="Aumenta" class="is-hover"><i data-lucide="plus" aria-hidden="true"></i></button></div></div>
    <div class="a24-state"><small>Focus on plus</small><div class="a24-qty" role="group" aria-label="Quantità"><button type="button" aria-label="Diminuisci"><i data-lucide="minus" aria-hidden="true"></i></button><output aria-live="polite">2</output><button type="button" aria-label="Aumenta" class="is-focus"><i data-lucide="plus" aria-hidden="true"></i></button></div></div>
    <div class="a24-state"><small>Updating</small><div class="a24-qty" role="group" aria-label="Quantità" aria-busy="true"><button type="button" aria-label="Diminuisci"><i data-lucide="minus" aria-hidden="true"></i></button><output aria-live="polite">4</output><button type="button" aria-label="Aumenta"><i data-lucide="plus" aria-hidden="true"></i></button></div></div>
    <div class="a24-state"><small>Disabled</small><div class="a24-qty" role="group" aria-label="Quantità" aria-disabled="true"><button type="button" aria-label="Diminuisci" disabled><i data-lucide="minus" aria-hidden="true"></i></button><output aria-live="polite">1</output><button type="button" aria-label="Aumenta" disabled><i data-lucide="plus" aria-hidden="true"></i></button></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
<script>document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-add]'); if (!b || b.classList.contains('is-added')) return;
  var label = b.querySelector('span'), old = label.textContent;
  b.classList.add('is-added'); label.textContent = 'Aggiunto';
  var c = document.querySelector('.a24-cart-count');
  if (c) { c.textContent = '(' + (parseInt(c.textContent.replace(/\D/g, ''), 10) + 1) + ')'; c.classList.remove('is-bump'); void c.offsetWidth; c.classList.add('is-bump'); }
  setTimeout(function () { b.classList.remove('is-added'); label.textContent = old; }, 1200);
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('.a24-qty button'); if (!b) return;
  var q = b.closest('.a24-qty'), o = q.querySelector('output'), n = parseInt(o.textContent, 10) + (b === q.lastElementChild ? 1 : -1);
  o.textContent = Math.max(1, n); q.firstElementChild.disabled = n <= 1;
});</script>
</body>
</html>
