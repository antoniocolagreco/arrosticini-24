<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>StatusBadge</title></head>
<body>
<div class="a24-demo">
  <div class="a24-demo-row" style="gap:32px">
    <div class="a24-state"><small>Order</small><div class="a24-demo-row" style="gap:10px"><span class="a24-badge a24-badge--pending">In attesa di pagamento</span><span class="a24-badge a24-badge--paid">Pagato</span><span class="a24-badge a24-badge--cancelled">Annullato</span></div></div>
    <div class="a24-state"><small>Product · admin</small><div class="a24-demo-row" style="gap:10px"><span class="a24-badge a24-badge--draft">Bozza</span><span class="a24-badge a24-badge--active">Attivo</span><span class="a24-badge a24-badge--archived">Archiviato</span></div></div>
    <div class="a24-state"><small>Address</small><span class="a24-badge a24-badge--default">Predefinito</span></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>

</body>
</html>
