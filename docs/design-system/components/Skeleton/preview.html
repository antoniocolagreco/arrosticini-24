<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Skeleton</title></head>
<body>
<div class="a24-demo">
  <div class="a24-demo-grid" style="grid-template-columns:260px minmax(0,1fr)">
    <article class="a24-product" aria-busy="true"><span class="a24-skel a24-skel--media"></span><div class="a24-product-body"><span class="a24-skel a24-skel--title"></span><span class="a24-skel a24-skel--line" style="width:40%;margin-top:6px"></span><span class="a24-skel a24-skel--price" style="margin-top:10px"></span><div class="a24-product-actions"><span class="a24-skel a24-skel--btn" style="flex:0 0 100px"></span><span class="a24-skel a24-skel--btn"></span></div></div></article>
    <div style="display:grid;gap:0" aria-busy="true">
      <div style="display:grid;grid-template-columns:96px 1fr 134px 96px;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)"><span class="a24-skel" style="aspect-ratio:4/3;border-radius:var(--radius-md)"></span><span style="display:grid;gap:8px"><span class="a24-skel a24-skel--title" style="width:55%"></span><span class="a24-skel a24-skel--line" style="width:35%"></span></span><span class="a24-skel a24-skel--btn"></span><span class="a24-skel a24-skel--price"></span></div>
      <div style="display:grid;grid-template-columns:96px 1fr 134px 96px;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)"><span class="a24-skel" style="aspect-ratio:4/3;border-radius:var(--radius-md)"></span><span style="display:grid;gap:8px"><span class="a24-skel a24-skel--title" style="width:40%"></span><span class="a24-skel a24-skel--line" style="width:25%"></span></span><span class="a24-skel a24-skel--btn"></span><span class="a24-skel a24-skel--price"></span></div>
      <div style="display:grid;gap:10px;padding-top:20px"><span class="a24-skel a24-skel--line" style="width:90%"></span><span class="a24-skel a24-skel--line" style="width:82%"></span><span class="a24-skel a24-skel--line" style="width:60%"></span></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>

</body>
</html>
