<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Alert</title></head>
<body>
<div class="a24-demo" style="max-width:720px">
  <div class="a24-alert a24-alert--success" role="status"><i data-lucide="circle-check" aria-hidden="true"></i><div><strong>Indirizzo salvato.</strong><p>Lo trovi tra i tuoi indirizzi e al prossimo checkout.</p></div><button class="a24-btn a24-btn--icon" type="button" aria-label="Chiudi"><i data-lucide="x" aria-hidden="true"></i></button></div>
  <div class="a24-alert a24-alert--error" role="alert"><i data-lucide="circle-alert" aria-hidden="true"></i><div><strong>Il pagamento non è andato a buon fine.</strong><p>Nessun addebito. Riprova o usa un'altra carta.</p></div><button class="a24-btn a24-btn--icon" type="button" aria-label="Chiudi"><i data-lucide="x" aria-hidden="true"></i></button></div>
  <div class="a24-alert a24-alert--success" role="status"><i data-lucide="circle-check" aria-hidden="true"></i><div><p>Carbone rimosso dal carrello. <a class="a24-link" href="#">Annulla</a></p></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>

</body>
</html>
