<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>AddressCard</title></head>
<body>
<div class="a24-demo">
  <p class="a24-demo-cap">Account · manage</p>
  <div class="a24-demo-grid" style="align-items:stretch">
    <div class="a24-address"><div class="a24-address-box"><div class="a24-address-head"><strong>Mario Rossi</strong><span class="a24-badge a24-badge--default">Predefinito</span></div><address>Via Roma 12<br>66100 Chieti (CH)<br>Italia</address><div class="a24-address-actions"><button class="a24-btn a24-btn--text" type="button"><i data-lucide="pencil" aria-hidden="true"></i>Modifica</button><button class="a24-btn a24-btn--text" type="button"><i data-lucide="trash-2" aria-hidden="true"></i>Rimuovi</button></div></div></div>
    <div class="a24-address"><div class="a24-address-box"><div class="a24-address-head"><strong>Anna Müller</strong></div><address>Lindenstraße 8<br>10969 Berlin<br>Germania</address><div class="a24-address-actions"><button class="a24-btn a24-btn--text" type="button"><i data-lucide="pencil" aria-hidden="true"></i>Modifica</button><button class="a24-btn a24-btn--text" type="button"><i data-lucide="trash-2" aria-hidden="true"></i>Rimuovi</button><button class="a24-btn a24-btn--text" type="button">Imposta come predefinito</button></div></div></div>
    <button class="a24-address-add" type="button"><i data-lucide="plus" aria-hidden="true"></i><b>Aggiungi indirizzo</b><span class="a24-muted" style="font-size:13px">2 di 5</span></button>
    <button class="a24-address-add" type="button" disabled><i data-lucide="map-pin" aria-hidden="true"></i><b>Aggiungi indirizzo</b><span style="font-size:13px">5 di 5 · rimuovine uno per aggiungerne un altro</span></button>
  </div>
  <p class="a24-demo-cap">Checkout · choose one</p>
  <div class="a24-demo-grid" style="align-items:stretch">
    <label class="a24-address"><input type="radio" name="addr" aria-label="Spedisci a Mario Rossi" checked><div class="a24-address-box"><div class="a24-address-head"><strong>Mario Rossi</strong><span class="a24-badge a24-badge--default">Predefinito</span></div><address>Via Roma 12<br>66100 Chieti (CH)<br>Italia</address></div></label>
    <label class="a24-address"><input type="radio" name="addr" aria-label="Spedisci a Anna Müller"><div class="a24-address-box"><div class="a24-address-head"><strong>Anna Müller</strong></div><address>Lindenstraße 8<br>10969 Berlin<br>Germania</address></div></label>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>

</body>
</html>
